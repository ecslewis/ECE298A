# Tiny Tapeout project information
project:
  title:        "8-bit Programmable Binary Counter"      # Project title
  author:       "Ella Lewis"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "8-bit up/down binary counter with asynchronous reset, synchronous parallel load and a tri-state output bus"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_ecslewis_counter8"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "counter8.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "OE (tri-state output enable, active high)"
  ui[1]: "LOAD (synchronous parallel load)"
  ui[2]: "CE (count enable)"
  ui[3]: "UP (1 = count up, 0 = count down)"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "Q0 (count monitor, always driven)"
  uo[1]: "Q1 (count monitor, always driven)"
  uo[2]: "Q2 (count monitor, always driven)"
  uo[3]: "Q3 (count monitor, always driven)"
  uo[4]: "Q4 (count monitor, always driven)"
  uo[5]: "Q5 (count monitor, always driven)"
  uo[6]: "Q6 (count monitor, always driven)"
  uo[7]: "Q7 (count monitor, always driven)"

  # Bidirectional pins
  uio[0]: "D0/Q0 (tri-state bus: Q out when OE=1, load data in when OE=0)"
  uio[1]: "D1/Q1 (tri-state bus)"
  uio[2]: "D2/Q2 (tri-state bus)"
  uio[3]: "D3/Q3 (tri-state bus)"
  uio[4]: "D4/Q4 (tri-state bus)"
  uio[5]: "D5/Q5 (tri-state bus)"
  uio[6]: "D6/Q6 (tri-state bus)"
  uio[7]: "D7/Q7 (tri-state bus)"

# Do not change!
yaml_version: 6
